<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuatro Amigos — DTS Staging</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: #FFF8ED; color: #3D2C4E; max-width: 640px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 1.4rem; }
  .char-select button { margin: 4px; padding: 10px 16px; border-radius: 12px; border: 1px solid #ccc; background: white; cursor: pointer; }
  .char-select button.active { background: #4CB8FF; color: white; }
  #word-bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
  .word-tile { padding: 10px 14px; border-radius: 10px; border: 1px solid #ddd; background: white; cursor: pointer; }
  #built-sentence { min-height: 30px; font-weight: bold; padding: 10px; background: white; border-radius: 10px; margin: 10px 0; }
  .actions button { padding: 12px 20px; border-radius: 12px; border: none; color: white; font-weight: bold; margin-right: 8px; cursor: pointer; }
  #check-btn { background: #4CD97D; }
  #clear-btn { background: #FF6B5B; }
  .feedback-correct { color: #2e7d32; font-weight: bold; }
  .feedback-retry { color: #c62828; font-weight: bold; }
  .vocab-word { padding: 8px 12px; margin: 4px; border-radius: 10px; border: 1px solid #ddd; background: #FFF; cursor: pointer; }
</style>
</head>
<body>
  <h1>Cuatro Amigos — Staging Preview</h1>

  <h2>Vocabulary</h2>
  <div id="vocab-list"></div>

  <h2>DTS — Role Play</h2>
  <div class="char-select" id="char-select"></div>
  <div id="word-bank"></div>
  <div id="built-sentence"></div>
  <div class="actions">
    <button id="check-btn" onclick="checkSentence()">Check</button>
    <button id="clear-btn" onclick="clearSentence()">Clear</button>
  </div>
  <div id="feedback"></div>

  <h2>Triangling (tú-block only — preview)</h2>
  <div class="char-select" id="triangling-char-select"></div>
  <div id="triangling-container"></div>

<script src="game3.js"></script>
<script>
  loadGameData().then(() => {
    renderVocabulary(document.getElementById("vocab-list"));
    const sel = document.getElementById("char-select");
    GAME_DATA.characters.forEach(c => {
      const btn = document.createElement("button");
      btn.textContent = c.name;
      btn.onclick = () => {
        document.querySelectorAll(".char-select button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectCharacter(c.name);
      };
      sel.appendChild(btn);
    });

    const triSel = document.getElementById("triangling-char-select");
    ["Paula","Lez","Clifford"].forEach(name => {
      const btn = document.createElement("button");
      btn.textContent = name;
      btn.onclick = () => {
        document.querySelectorAll("#triangling-char-select button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectTrianglingCharacter(name);
      };
      triSel.appendChild(btn);
    });
  });
</script>
</body>
</html>
